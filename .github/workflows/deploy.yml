name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: SPA fallback
        run: |
          cp dist/index.html dist/404.html
          # so existe o Play de Todas (dono, 08/11/2026): o Play de Terca e o Play Mista sairam do ar. Os
          # enderecos antigos levam para a raiz e o sw.js de saida desinstala o app antigo de quem o tinha.
          cp -r public-fora-do-ar dist/masculino
          cp -r public-fora-do-ar dist/mista
      - uses: actions/configure-pages@v5
        # liga o GitHub Pages automaticamente na primeira execucao
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
